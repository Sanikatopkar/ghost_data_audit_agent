[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-data-audit-agent"
version = "1.0.0"
description = "Deterministic deletion audit and remediation planning for CSV data snapshots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pypdf>=5.0"]

[project.scripts]
ghost-audit = "ghost_audit.cli:main"

[tool.setuptools.packages.find]
include = ["ghost_audit*"]

